name: Release steps

# Every PR says whether it adds steps the next release must do beyond
# `pnpm release`, and puts them in docs/next-release.md, whether it's a
# breaking backend change, and whether it raises the app's runtime version
# (scripts/check-release-steps.ts). A PR that raises BREAKING_VERSION gets
# the "💥 Breaking Backend" label; one that raises RUNTIME_VERSION gets
# "⛔ New Runtime". Reruns when the description is edited.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: release-steps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No install needed, so no pnpm (setup-node caches it by default).
          package-manager-cache: false

      - name: Check the description's release steps
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/check-release-steps.ts

      # From the file itself, so the label is right even when the
      # description's line isn't.
      - name: Label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          version() {
            git show "$1:services/backend/breaking-version.ts" 2>/dev/null \
              | grep -oE 'BREAKING_VERSION = [0-9]+' || true
          }
          before="$(version "$BASE_SHA")"
          after="$(version HEAD)"
          label="💥 Breaking Backend"
          gh label create "$label" --color b60205 --force \
            --description "Raises BREAKING_VERSION: ship with pnpm release ota production --with-backend" \
            --repo "$GITHUB_REPOSITORY"
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            gh pr edit "$PR" --add-label "$label" --repo "$GITHUB_REPOSITORY"
          else
            gh pr edit "$PR" --remove-label "$label" --repo "$GITHUB_REPOSITORY" || true
          fi
          runtimes() {
            git show "$1:apps/mobile/app.config.ts" 2>/dev/null \
              | sed -n '/const RUNTIME_VERSION = {/,/};/p' || true
          }
          before="$(runtimes "$BASE_SHA")"
          after="$(runtimes HEAD)"
          label="⛔ New Runtime"
          gh label create "$label" --color 5319e7 --force \
            --description "Raises the runtime version: older binaries stop getting updates until they install a store build" \
            --repo "$GITHUB_REPOSITORY"
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            gh pr edit "$PR" --add-label "$label" --repo "$GITHUB_REPOSITORY"
          else
            gh pr edit "$PR" --remove-label "$label" --repo "$GITHUB_REPOSITORY" || true
          fi
